<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>YCS graphics preview</title>
<style>
  /* No color-scheme here: a dark scheme would give the graphics an opaque background. */
  :root { --bg:#14161a; --panel:#1e2127; --line:#30343c; --text:#f2f3f5; --dim:#9aa1ad; --bad:#ffb020; }
  * { box-sizing:border-box; }
  /* Room for the scrollbar is always kept, so a sized tile can't flicker as the scrollbar comes and goes. */
  html { background:var(--bg); scrollbar-gutter:stable; }
  body { margin:0; padding:16px; color:var(--text); font:15px/1.3 "Segoe UI", Arial, sans-serif; }
  header { display:flex; flex-wrap:wrap; align-items:center; gap:8px 12px; margin-bottom:14px; }
  h1 { margin:0 8px 0 0; font-size:20px; font-weight:600; }
  select, button { color:var(--text); background:#30343c; border:1px solid #4a4f59; border-radius:4px; padding:5px 10px; font:inherit; font-size:14px; }
  button { cursor:pointer; }
  button:hover { background:#3b404a; }
  #note { color:var(--dim); font-size:14px; }
  #status { margin-left:auto; color:var(--dim); font-size:14px; font-variant-numeric:tabular-nums; }
  #status.bad { color:#14161a; background:var(--bad); padding:4px 10px; border-radius:4px; font-weight:600; }
  .icon-button { display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:4px 7px; }
  svg { flex:none; }
  /* The left panel lists every graphic with an eye to show or hide it, and folds to a thin strip. */
  .workspace { display:flex; gap:12px; align-items:flex-start; }
  #panel { flex:none; width:230px; position:sticky; top:12px; max-height:calc(100vh - 24px); overflow:auto; padding:6px; background:var(--panel); border:1px solid var(--line); border-radius:8px; }
  #panel.folded { width:auto; }
  #panel.folded .unfolded-only { display:none; }
  .panel-head { display:flex; align-items:center; gap:8px; padding:2px 2px 6px; }
  #panel:not(.folded) .panel-head { border-bottom:1px solid var(--line); }
  .panel-title { font-weight:600; }
  #count { margin-left:auto; color:var(--dim); font-size:12px; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .panel-buttons { display:flex; gap:6px; margin:8px 2px 2px; }
  .panel-buttons button { flex:1; }
  .group { margin:12px 6px 3px; color:var(--dim); font-size:12px; letter-spacing:.04em; }
  .eye-row { display:flex; align-items:center; gap:8px; width:100%; padding:5px 6px; color:var(--text); background:none; border:0; border-radius:6px; text-align:left; font-size:13px; }
  .eye-row:hover { background:#262a31; }
  .eye-row span { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .eye-row.off { color:#5c626d; }
  .eye-row.off span { color:var(--dim); text-decoration:line-through; }
  #empty { flex:1 1 100%; margin:0; padding:40px 16px; color:var(--dim); text-align:center; }
  /* Tiles flow left to right. Their order is set with CSS order rather than by moving them in the page,
     because moving an iframe reloads its graphic. A tile given a width keeps it; otherwise it shares the row. */
  #tiles { flex:1; min-width:0; display:flex; flex-wrap:wrap; gap:12px; align-items:flex-start; }
  .tile { position:relative; flex:1 1 440px; min-width:0; max-width:100%; background:var(--panel); border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  .tile.wide { flex-basis:100%; }
  .tile.sized { flex:0 0 auto; }
  .tile.dragging { opacity:.4; }
  .tile.drop-target { outline:2px dashed #00a9ed; outline-offset:2px; }
  .tile-head { display:flex; align-items:center; gap:8px; padding:6px 8px 6px 10px; border-bottom:1px solid var(--line); cursor:grab; }
  .tile-head:active { cursor:grabbing; }
  .drag-dots { color:var(--dim); }
  .tile-title { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:600; }
  .hide-tile { flex:none; color:var(--dim); }
  /* Drag the corner to resize; double-click it to go back to the automatic size. */
  .grip { position:absolute; right:0; bottom:0; z-index:1; width:20px; height:20px; display:flex; align-items:flex-end; justify-content:flex-end; padding:3px; color:var(--dim); cursor:nwse-resize; touch-action:none; }
  .grip:hover { color:var(--text); }
  /* The checkerboard shows which parts of a graphic are see-through. */
  .crop { position:relative; overflow:hidden; display:flex; align-items:center; justify-content:center; min-height:96px; color:var(--dim); font-size:14px; background:repeating-conic-gradient(#2a2d33 0% 25%, #1b1d22 0% 50%) 0 0 / 24px 24px; }
  .crop iframe { position:absolute; left:0; top:0; width:1920px; height:1080px; border:0; background:transparent; transform-origin:0 0; pointer-events:none; }
  .problem { padding:6px 12px; color:#14161a; background:var(--bad); font-size:13px; font-weight:600; overflow-wrap:anywhere; }
</style>
</head>
<body>
<header>
  <h1>Graphics preview</h1>
  <label for="stage">Stage</label>
  <select id="stage"></select>
  <button id="replay" type="button">Replay all</button>
  <button id="reset-layout" type="button" title="Put the tiles back in rundown order at their automatic sizes">Reset layout</button>
  <span id="note">Preview only. Nothing here goes to air.</span>
  <span id="status" role="status">Connecting…</span>
</header>
<div class="workspace">
  <aside id="panel" aria-label="Choose which graphics to show">
    <div class="panel-head">
      <button id="fold" class="icon-button" type="button" aria-expanded="true" aria-controls="panel-body"></button>
      <span class="panel-title unfolded-only">Graphics</span>
      <span id="count" class="unfolded-only"></span>
    </div>
    <div id="panel-body" class="unfolded-only">
      <div class="panel-buttons">
        <button id="all-on" class="icon-button" type="button" title="Show every graphic"></button>
        <button id="all-off" class="icon-button" type="button" title="Hide every graphic"></button>
      </div>
      <div id="panel-list"></div>
    </div>
  </aside>
  <main id="tiles">
    <p id="empty" hidden>Every graphic is hidden. Click an eye on the left to show one.</p>
  </main>
</div>

<script>
  'use strict';
  const EVERY_MS = 3000;
  const RETRY_MS = 10000;  // A tile that failed to load tries again this often.
  const FRAME = { x: 0, y: 0, w: 1920, h: 1080 };
  const MAX_TILE_HEIGHT = 300;
  const WIDE_SHAPE = 6;    // A crop this many times wider than tall takes a whole row.
  const CROP_MARGIN = 16;
  const SETTLE_MS = 1500;  // Entrances are finished by now, so sizes are final.
  const MIN_TILE_WIDTH = 240;

  // Line icons (drawn here so the page needs nothing from the internet).
  const svg = body => '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + body + '</svg>';
  const ICON = {
    eye: svg('<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/>'),
    eyeOff: svg('<path d="M3 3l18 18"/><path d="M10.6 5.1A10.8 10.8 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.2 4.1"/><path d="M6.6 6.6C3.9 8.3 2 12 2 12s3.6 7 10 7a9.7 9.7 0 0 0 5.4-1.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/>'),
    fold: svg('<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/><path d="M16 10l-2 2 2 2"/>'),
    unfold: svg('<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/><path d="M14 10l2 2-2 2"/>'),
    dots: svg('<circle cx="9" cy="6" r="1"/><circle cx="9" cy="12" r="1"/><circle cx="9" cy="18" r="1"/><circle cx="15" cy="6" r="1"/><circle cx="15" cy="12" r="1"/><circle cx="15" cy="18" r="1"/>'),
    grip: '<svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M11 4L4 11M11 8L8 11"/></svg>'
  };
  // The slots in the order the panel lists them; any other slot follows under its own name.
  const SLOTS = [['ticker', 'Bug'], ['lower-third', 'Lower third'], ['upper-third', 'Upper third'], ['full-screen', 'Full screen']];

  const $ = id => document.getElementById(id);
  const emptyNote = $('empty');
  const statusLine = $('status');
  const pause = ms => new Promise(resolve => setTimeout(resolve, ms));
  const limited = (promise, ms, message) => Promise.race([
    promise,
    new Promise((_, reject) => setTimeout(() => reject(new Error(message)), ms))
  ]);

  class NeedsLogin extends Error {}
  class SpxAnswer extends Error {}  // SPX answered, but with an error for this request.

  // Every SPX request on this page reads. Nothing here plays, stops or saves anything.
  async function renewSession() {
    const reply = await fetch('/ycs/session', { cache: 'no-store', signal: AbortSignal.timeout(5000) });
    if (reply.redirected || reply.status === 401 || reply.status === 403) throw new NeedsLogin('Log in to SPX, then reload this page');
    if (!reply.ok) throw new SpxAnswer('SPX answered ' + reply.status);
  }
  async function read(path) {
    const get = () => fetch('/api/ycs' + path, { cache: 'no-store', signal: AbortSignal.timeout(5000) });
    let reply = await get();
    if (reply.status === 401 || reply.status === 403) {
      await renewSession();
      reply = await get();
    }
    if (!reply.ok) throw new SpxAnswer('SPX answered ' + reply.status);
    return reply.json();
  }

  function explain(error) {
    if (error.name === 'TimeoutError') return 'SPX took too long to answer';
    if (error.name === 'TypeError' && /fetch/i.test(error.message)) return 'could not reach SPX';
    return error.message;
  }

  let stageId = '';
  let tiles = [];            // In rundown order.
  let ordered = [];          // The same tiles in the order they're shown.
  let dragging = null;       // The tile being dragged to a new place.
  let rundownKey = '';
  let loadNumber = 0;        // Goes up on each stage load, so older work can tell it's out of date.
  const hiddenByStage = new Map(); // Which graphics you hid, remembered in this browser per stage.

  const keyOf = items => JSON.stringify(items.map(item => [item.id, item.template]));

  const storageKey = () => 'ycs.preview.hidden.' + stageId;

  function hiddenSet() {
    if (!hiddenByStage.has(stageId)) {
      let saved = [];
      try {
        const parsed = JSON.parse(localStorage.getItem(storageKey()));
        if (Array.isArray(parsed)) saved = parsed;
      } catch { /* Nothing usable saved, so everything shows. */ }
      hiddenByStage.set(stageId, new Set(saved));
    }
    return hiddenByStage.get(stageId);
  }

  function saveHidden() {
    // If this browser won't save, the choice still lasts until the page is reloaded.
    try { localStorage.setItem(storageKey(), JSON.stringify([...hiddenSet()])); } catch {}
  }

  // Tile order and sizes, remembered in this browser per stage. A graphic new to the rundown goes at the
  // end at its automatic size; one that left the rundown is forgotten the next time the layout is saved.
  const layoutKey = () => 'ycs.preview.layout.' + stageId;
  function savedLayout() {
    try {
      const saved = JSON.parse(localStorage.getItem(layoutKey()));
      if (saved && typeof saved === 'object') {
        return {
          order: Array.isArray(saved.order) ? saved.order.filter(id => typeof id === 'string') : [],
          widths: saved.widths && typeof saved.widths === 'object' && !Array.isArray(saved.widths) ? saved.widths : {}
        };
      }
    } catch { /* Nothing usable saved, so the automatic layout is used. */ }
    return { order: [], widths: {} };
  }
  function saveLayout() {
    const widths = Object.fromEntries(tiles.filter(tile => tile.width).map(tile => [tile.item.id, tile.width]));
    try { localStorage.setItem(layoutKey(), JSON.stringify({ order: ordered.map(tile => tile.item.id), widths })); } catch {}
  }
  function applyOrder() {
    ordered.forEach((tile, index) => { tile.element.style.order = String(index); });
  }
  function applyLayout() {
    const saved = savedLayout();
    const position = new Map(saved.order.map((id, index) => [id, index]));
    const rank = tile => position.has(tile.item.id) ? position.get(tile.item.id) : saved.order.length + tiles.indexOf(tile);
    ordered = [...tiles].sort((a, b) => rank(a) - rank(b));
    applyOrder();
    for (const tile of tiles) {
      const width = Number(saved.widths[tile.item.id]);
      setWidth(tile, Number.isFinite(width) && width >= MIN_TILE_WIDTH ? Math.round(width) : null);
    }
  }
  function setWidth(tile, width) {
    tile.width = width;
    tile.element.classList.toggle('sized', Boolean(width));
    tile.element.style.width = width ? width + 'px' : '';
    place(tile);
  }
  // A tile dropped on another takes that tile's place; the ones between shift along by one.
  function moveTile(moving, target) {
    const from = ordered.indexOf(moving), to = ordered.indexOf(target);
    if (from < 0 || to < 0 || from === to) return;
    ordered.splice(from, 1);
    ordered.splice(to, 0, moving);
    applyOrder();
    saveLayout();
  }

  // The panel folds to a thin strip; this browser remembers which.
  const FOLD_KEY = 'ycs.preview.panelFolded';
  function foldPanel(folded, remember) {
    $('panel').classList.toggle('folded', folded);
    $('fold').innerHTML = folded ? ICON.unfold : ICON.fold;
    $('fold').title = folded ? 'Show the graphics list' : 'Fold the graphics list';
    $('fold').setAttribute('aria-label', $('fold').title);
    $('fold').setAttribute('aria-expanded', String(!folded));
    if (remember) try { localStorage.setItem(FOLD_KEY, folded ? '1' : '0'); } catch {}
  }

  // The panel lists the graphics by slot, in rundown order within each slot.
  function drawPanel() {
    const list = $('panel-list');
    list.replaceChildren();
    const slots = [...SLOTS];
    for (const tile of tiles) {
      const slot = tile.item.slot || 'other';
      if (!slots.some(([id]) => id === slot)) slots.push([slot, slot === 'other' ? 'Other' : slot]);
    }
    for (const [slot, name] of slots) {
      const inSlot = tiles.filter(tile => (tile.item.slot || 'other') === slot);
      if (!inSlot.length) continue;
      const heading = document.createElement('div');
      heading.className = 'group';
      heading.textContent = name;
      list.append(heading, ...inSlot.map(tile => tile.choice));
    }
  }

  function showCount() {
    const showing = tiles.filter(tile => tile.on).length;
    $('count').textContent = tiles.length ? showing + ' of ' + tiles.length + ' showing' : '';
    emptyNote.hidden = !tiles.length || showing > 0;
  }

  // Marks a graphic as in or out of the grid. Doesn't load or remove its page.
  function mark(tile, shown) {
    tile.on = shown;
    tile.choice.classList.toggle('off', !shown);
    tile.choice.setAttribute('aria-pressed', String(shown));
    tile.choice.title = shown ? 'Showing. Click to hide it here' : 'Hidden. Click to show it here';
    tile.eye.innerHTML = shown ? ICON.eye : ICON.eyeOff;
    tile.element.hidden = !shown;
    if (shown) hiddenSet().delete(tile.item.id);
    else hiddenSet().add(tile.item.id);
  }

  // A hidden graphic's page is removed, so it uses nothing until it's shown again.
  function choose(tile, shown) {
    mark(tile, shown);
    saveHidden();
    showCount();
    if (!shown) hide(tile, true);
    else if (waiting(tile)) show(tile);
  }

  function setTitle(tile, item) {
    tile.titleLine.textContent = tile.titleLine.title = item.title || item.id;
    tile.choiceName.textContent = tile.choiceName.title = item.title || item.id;
    tile.hideButton.setAttribute('aria-label', 'Hide ' + (item.title || item.id));
    tile.hideButton.title = 'Hide this graphic here';
    tile.frame?.setAttribute('title', item.title || item.id);
    tile.item = item;
  }

  function buildTile(item) {
    const element = document.createElement('section');
    element.className = 'tile';
    // The title bar is the handle for dragging the tile to a new place.
    const head = document.createElement('div');
    head.className = 'tile-head';
    head.draggable = true;
    head.title = 'Drag to move this tile';
    const dots = document.createElement('span');
    dots.className = 'drag-dots';
    dots.innerHTML = ICON.dots;
    const titleLine = document.createElement('div');
    titleLine.className = 'tile-title';
    const hideButton = document.createElement('button');
    hideButton.type = 'button';
    hideButton.className = 'hide-tile icon-button';
    hideButton.draggable = false;
    hideButton.innerHTML = ICON.eyeOff;
    head.append(dots, titleLine, hideButton);
    // Its row in the left panel: an eye and the graphic's name.
    const choice = document.createElement('button');
    choice.type = 'button';
    choice.className = 'eye-row';
    const eye = document.createElement('span');
    eye.style.display = 'contents';
    const choiceName = document.createElement('span');
    choice.append(eye, choiceName);
    const crop = document.createElement('div');
    crop.className = 'crop';
    const problem = document.createElement('div');
    problem.className = 'problem';
    problem.hidden = true;
    const grip = document.createElement('div');
    grip.className = 'grip';
    grip.title = 'Drag to resize. Double-click for the automatic size';
    grip.innerHTML = ICON.grip;
    element.append(head, crop, problem, grip);

    const tile = {
      item, element, crop, problem, titleLine, choice, eye, choiceName, hideButton,
      on: true, width: null,
      frame: null, ready: false, loading: false, token: 0, retryAt: 0, warning: '', readNote: '',
      data: null, signature: '', exitMs: 250, box: null
    };
    setTitle(tile, item);
    mark(tile, !hiddenSet().has(item.id));
    choice.addEventListener('click', () => choose(tile, !tile.on));
    hideButton.addEventListener('click', () => choose(tile, false));
    new ResizeObserver(() => place(tile)).observe(crop);

    head.addEventListener('dragstart', event => {
      dragging = tile;
      element.classList.add('dragging');
      event.dataTransfer.effectAllowed = 'move';
      event.dataTransfer.setData('text/plain', item.title || item.id);
    });
    head.addEventListener('dragend', () => {
      dragging = null;
      for (const other of tiles) other.element.classList.remove('dragging', 'drop-target');
    });
    element.addEventListener('dragover', event => {
      if (!dragging || dragging === tile) return;
      event.preventDefault();
      event.dataTransfer.dropEffect = 'move';
      element.classList.add('drop-target');
    });
    element.addEventListener('dragleave', event => {
      if (!element.contains(event.relatedTarget)) element.classList.remove('drop-target');
    });
    element.addEventListener('drop', event => {
      event.preventDefault();
      element.classList.remove('drop-target');
      if (dragging && dragging !== tile) moveTile(dragging, tile);
    });

    grip.addEventListener('pointerdown', event => {
      if (event.button !== 0) return;
      event.preventDefault();
      grip.setPointerCapture(event.pointerId);
      const startX = event.clientX, startWidth = element.getBoundingClientRect().width;
      const widest = Math.max(MIN_TILE_WIDTH, $('tiles').clientWidth);
      const pointer = event.pointerId;
      let done = false;
      const end = () => {
        if (done) return;
        done = true;
        grip.removeEventListener('pointermove', move);
        grip.removeEventListener('pointerup', end);
        grip.removeEventListener('pointercancel', end);
        grip.removeEventListener('lostpointercapture', end);
        saveLayout();
      };
      // Only the pointer that grabbed the corner resizes, and only while its button is held.
      const move = moved => {
        if (moved.pointerId !== pointer) return;
        if (moved.buttons === 0) { end(); return; }
        setWidth(tile, Math.round(Math.min(widest, Math.max(MIN_TILE_WIDTH, startWidth + moved.clientX - startX))));
      };
      grip.addEventListener('pointermove', move);
      grip.addEventListener('pointerup', end);
      grip.addEventListener('pointercancel', end);
      grip.addEventListener('lostpointercapture', end);
    });
    grip.addEventListener('dblclick', () => { setWidth(tile, null); saveLayout(); });
    return tile;
  }

  function say(tile, text) {
    let line = tile.crop.querySelector('span');
    if (!text) { line?.remove(); return; }
    if (!line) { line = document.createElement('span'); tile.crop.append(line); }
    line.textContent = text;
  }

  // Kept apart so a brief read error can't wipe a warning about what the graphic is showing.
  function drawProblem(tile) {
    const text = [tile.warning, tile.readNote].filter(Boolean).join(' · ');
    tile.problem.textContent = text;
    tile.problem.hidden = !text;
  }
  function warn(tile, text) {
    tile.warning = text || '';
    drawProblem(tile);
  }
  function noteRead(tile, text) {
    tile.readNote = text || '';
    drawProblem(tile);
  }

  // Fields follow SPX's own rule (descriptor in playback.cjs): a field switched to linked
  // uses its source, and anything else uses its saved value. SPX's mapping route supplies
  // the checked source value, which is already the saved value if the source has none. That
  // route fills in mapped fields even when they aren't linked, so the switch is checked here.
  async function fetchData(tile, stage, editor, sources) {
    const mapping = await read('/data/mappings/' + stage + '/' + tile.item.id);
    const fromSource = new Map(mapping.fields.map(field => [field.field, field.value]));
    const data = {};
    for (const field of editor.fields) {
      if (!field.field) continue;
      const link = editor.links[field.field];
      if (link?.mode !== 'linked' || !fromSource.has(field.field)) {
        data[field.field] = field.value ?? '';
        continue;
      }
      data[field.field] = fromSource.get(field.field);
      // While a cleared story list waits to be confirmed, the show keeps the previous list
      // but the mapping route already reports it empty. Use the list the show would use.
      const held = sources[link.source]?.value;
      if (field.ycsCollection && data[field.field] === '[]' && typeof held === 'string') data[field.field] = held;
    }
    tile.exitMs = mapping.graphic?.exitMs ?? 250;
    return data;
  }

  // Changes whenever a saved value, a link or a linked source's value changes.
  function signatureOf(editor, sources) {
    return JSON.stringify(editor.fields.map(field => {
      const link = editor.links[field.field];
      return [field.field, field.value, link?.mode, link?.source, link?.source ? sources[link.source]?.value : undefined];
    }));
  }

  // A graphic that refuses its data keeps showing what it had, so that has to be visible.
  async function send(tile) {
    const frame = tile.frame, token = tile.token;
    try {
      await limited(Promise.resolve(frame.contentWindow.update(JSON.stringify(tile.data))), 8000, 'it took too long');
      if (token === tile.token) warn(tile, '');
    } catch (error) {
      if (token === tile.token) warn(tile, 'This graphic refused its data and may be showing old or sample details: ' + error.message);
    }
  }

  // Crops to what the graphic really draws. A graphic in a single box uses that box and its
  // direct parts, because the ticker's logo sticks out of its box. Going no deeper leaves out
  // text waiting behind a mask, like the ticker's crawl. Graphics that fill the whole frame
  // have their visible parts measured instead.
  function findBox(doc, root, ignoreHidden) {
    const view = doc.defaultView;
    const counts = element => {
      const style = view.getComputedStyle(element);
      return style.display !== 'none' && (ignoreHidden || style.visibility !== 'hidden');
    };
    const whole = root.getBoundingClientRect();
    const parts = whole.width < 1900 || whole.height < 1000
      ? [root, ...[...root.children].filter(counts)]
      : [...root.querySelectorAll('*')].filter(counts);
    let left = Infinity, top = Infinity, right = -Infinity, bottom = -Infinity;
    for (const part of parts) {
      const rect = part.getBoundingClientRect();
      if (rect.width < 1 || rect.height < 1) continue;
      left = Math.min(left, rect.left); top = Math.min(top, rect.top);
      right = Math.max(right, rect.right); bottom = Math.max(bottom, rect.bottom);
    }
    const x = Math.max(0, Math.floor(left - CROP_MARGIN)), y = Math.max(0, Math.floor(top - CROP_MARGIN));
    const w = Math.min(1920, Math.ceil(right + CROP_MARGIN)) - x, h = Math.min(1080, Math.ceil(bottom + CROP_MARGIN)) - y;
    return w > 0 && h > 0 ? { x, y, w, h } : null;
  }

  function useBox(tile, box) {
    if (!box) return;
    const old = tile.box;
    if (old && Math.abs(old.x - box.x) < 3 && Math.abs(old.y - box.y) < 3 && Math.abs(old.w - box.w) < 3 && Math.abs(old.h - box.h) < 3) return;
    tile.box = box;
    place(tile);
  }

  // Before the entrance, the ticker waits below the screen. Its resting place is measured
  // with that offset briefly removed, inside one step so it never gets drawn.
  function measureBeforeEntrance(tile) {
    const doc = tile.frame?.contentDocument, root = doc?.body?.firstElementChild;
    if (!root) return;
    const { transition, transform } = root.style;
    root.style.transition = 'none';
    root.style.transform = 'none';
    const box = findBox(doc, root, true);
    root.style.transform = transform;
    root.getBoundingClientRect();
    root.style.transition = transition;
    useBox(tile, box);
  }

  function measure(tile) {
    // Animations don't run in a hidden browser tab, so sizes then aren't final.
    if (document.hidden) return;
    const doc = tile.frame?.contentDocument, root = doc?.body?.firstElementChild;
    if (root) useBox(tile, findBox(doc, root, false));
  }

  function place(tile) {
    const box = tile.box || FRAME;
    tile.element.classList.toggle('wide', box.w / box.h >= WIDE_SHAPE);
    const width = tile.crop.clientWidth;
    if (!width || !tile.box) return;
    // A tile you've sized shows the graphic as big as its width allows; otherwise height is capped.
    const scale = Math.min(width / box.w, tile.width ? Infinity : MAX_TILE_HEIGHT / box.h, 1);
    tile.crop.style.height = Math.ceil(box.h * scale) + 'px';
    if (!tile.frame) return;
    const left = Math.max(0, (width - box.w * scale) / 2);
    tile.frame.style.transform = `translate(${left}px, 0) scale(${scale}) translate(${-box.x}px, ${-box.y}px)`;
  }

  async function show(tile) {
    const token = ++tile.token, load = loadNumber, stage = stageId;
    const stale = () => token !== tile.token || load !== loadNumber;
    tile.loading = true;
    if (tile.problem.hidden) say(tile, 'Loading…');
    let frame;
    try {
      const [editor, { sources }] = await Promise.all([
        read('/stages/' + stage + '/graphics/' + tile.item.id + '/editor'),
        read('/data?datasets=none')
      ]);
      const values = await fetchData(tile, stage, editor, sources);
      if (stale()) return;
      tile.signature = signatureOf(editor, sources);
      tile.data = values;

      frame = document.createElement('iframe');
      frame.title = tile.item.title || tile.item.id;
      frame.style.visibility = 'hidden';
      const loaded = new Promise((resolve, reject) => { frame.onload = resolve; frame.onerror = reject; });
      frame.src = '/templates' + editor.template;
      tile.crop.append(frame);
      await limited(loaded, 8000, 'the page took too long to load');
      if (stale()) { frame.remove(); return; }
      // SPX's "not found" page loads like any other, so check it's really a graphic
      // before showing it. Otherwise each retry would flash that page in the tile.
      if (typeof frame.contentWindow.update !== 'function' || typeof frame.contentWindow.play !== 'function')
        throw new Error('its page is missing or broken');
      tile.frame = frame;
      tile.ready = false;
      await send(tile);
      if (stale()) return;
      measureBeforeEntrance(tile);
      place(tile);
      frame.style.visibility = '';
      say(tile, '');
      await limited(Promise.resolve(frame.contentWindow.play()), 8000, 'it took too long to play');
      if (stale()) return;
      tile.ready = true;
      tile.retryAt = 0;
      setTimeout(() => { if (!stale()) measure(tile); }, SETTLE_MS);
    } catch (error) {
      if (stale()) { frame?.remove(); return; }
      frame?.remove();
      if (tile.frame === frame) tile.frame = null;
      tile.ready = false;
      tile.retryAt = Date.now() + RETRY_MS;
      say(tile, '');
      warn(tile, 'Could not load this graphic, still trying: ' + explain(error));
    } finally {
      if (token === tile.token) tile.loading = false;
    }
  }

  async function hide(tile, immediately) {
    tile.token++;
    const frame = tile.frame;
    tile.frame = null;
    tile.ready = tile.loading = false;
    tile.retryAt = 0;
    tile.warning = '';
    noteRead(tile, '');
    if (frame) {
      if (!immediately) {
        try {
          await limited(Promise.resolve(frame.contentWindow.stop()), 2000, 'exit timed out');
          await pause(Math.min(tile.exitMs, 2000));
        } catch { /* The page is removed either way. */ }
      }
      frame.remove();
    }
    if (!tile.on) say(tile, '');
  }

  const waiting = tile => tile.on && !tile.frame && !tile.loading;

  async function showAll(list) {
    const load = loadNumber;
    // One at a time, so opening the page doesn't load every graphic in the same instant.
    for (const tile of list) {
      if (load !== loadNumber) return;
      if (waiting(tile)) await show(tile);
    }
  }

  async function loadStage(id) {
    const load = ++loadNumber;
    stageId = id;
    rundownKey = '';  // Nothing is loaded until the read below works, so the next refresh retries it.
    history.replaceState(null, '', '?stage=' + encodeURIComponent(id));
    for (const tile of tiles) { tile.token++; tile.frame?.remove(); }
    tiles = [];
    ordered = [];
    dragging = null;
    $('tiles').replaceChildren(emptyNote);
    $('panel-list').replaceChildren();
    showCount();
    setStatus('Loading…');
    const items = await read('/stages/' + id + '/graphics');
    if (load !== loadNumber) return;
    rundownKey = keyOf(items);
    tiles = items.map(buildTile);
    $('tiles').append(...tiles.map(tile => tile.element));
    applyLayout();
    drawPanel();
    showCount();
    // Loaded in the order they're shown, so the first tiles on screen fill in first.
    await showAll(ordered);
  }

  // Brings open tiles up to date, and retries any that failed to load.
  // A graphic only gets new data when something changed.
  async function refresh() {
    const load = loadNumber, stage = stageId;
    const items = await read('/stages/' + stage + '/graphics');
    if (load !== loadNumber) return;
    if (keyOf(items) !== rundownKey) {
      await loadStage(stage);
      return;
    }
    items.forEach((item, index) => { if (item.title !== tiles[index].item.title) setTitle(tiles[index], item); });
    const { sources } = await read('/data?datasets=none');
    for (const tile of tiles) {
      if (load !== loadNumber) return;
      // Not waited for, so one slow graphic can't hold up the tiles after it.
      if (waiting(tile) && Date.now() >= tile.retryAt) { show(tile); continue; }
      if (!tile.ready || !tile.frame) continue;
      const token = tile.token;
      const current = () => load === loadNumber && token === tile.token && tile.ready && tile.frame;
      try {
        const editor = await read('/stages/' + stage + '/graphics/' + tile.item.id + '/editor');
        const signature = signatureOf(editor, sources);
        if (signature !== tile.signature) {
          const values = await fetchData(tile, stage, editor, sources);
          if (!current()) continue;
          tile.signature = signature;
          if (JSON.stringify(values) !== JSON.stringify(tile.data)) {
            tile.data = values;
            await send(tile);
          }
        }
        if (!current()) continue;
        if (tile.readNote) noteRead(tile, '');
        measure(tile);
      } catch (error) {
        // One graphic SPX won't answer for mustn't stop the rest. Connection problems go up
        // to the status line instead, so they don't wait out a timeout on every tile.
        if (!(error instanceof SpxAnswer)) throw error;
        if (current()) noteRead(tile, 'Could not read this graphic\'s latest data, so it may be out of date: ' + error.message);
      }
    }
  }

  function setStatus(text, bad) {
    statusLine.textContent = text;
    statusLine.className = bad ? 'bad' : '';
  }
  const notUpdating = error => setStatus('NOT UPDATING: ' + explain(error) + ' · still trying', true);

  async function start() {
    await renewSession();
    const stages = await read('/stages');
    $('stage').replaceChildren(...stages.map(stage => new Option(stage.title, stage.id)));
    const wanted = new URLSearchParams(location.search).get('stage');
    const first = stages.find(stage => stage.id === wanted) || stages[0];
    $('stage').value = first.id;
    await loadStage(first.id);
  }

  async function keepUpdating() {
    try {
      if (stageId) await refresh();
      else await start();
      setStatus('Live · updated ' + new Date().toLocaleTimeString());
    } catch (error) {
      notUpdating(error);
    }
    setTimeout(keepUpdating, EVERY_MS);
  }

  $('all-on').innerHTML = ICON.eye + 'All';
  $('all-off').innerHTML = ICON.eyeOff + 'None';
  let folded = false;
  try { folded = localStorage.getItem(FOLD_KEY) === '1'; } catch {}
  foldPanel(folded, false);
  $('fold').addEventListener('click', () => foldPanel(!$('panel').classList.contains('folded'), true));
  $('reset-layout').addEventListener('click', () => {
    if (!confirm('Put this stage’s tiles back in rundown order at their automatic sizes?')) return;
    try { localStorage.removeItem(layoutKey()); } catch {}
    applyLayout();
  });

  $('stage').addEventListener('change', event => { loadStage(event.target.value).catch(notUpdating); });
  $('all-on').addEventListener('click', () => {
    for (const tile of tiles) mark(tile, true);
    saveHidden();
    showCount();
    showAll(ordered);
  });
  $('all-off').addEventListener('click', () => {
    for (const tile of tiles) { mark(tile, false); hide(tile, true); }
    saveHidden();
    showCount();
  });
  $('replay').addEventListener('click', async () => {
    const load = loadNumber;
    // Replaying removes each graphic, so check SPX can supply them again first.
    try {
      await read('/stages/' + stageId + '/graphics');
    } catch (error) {
      notUpdating(error);
      return;
    }
    if (load !== loadNumber) return;
    await Promise.all(tiles.filter(tile => tile.on).map(tile => hide(tile)));
    if (load === loadNumber) showAll(ordered);
  });

  keepUpdating();
</script>
</body>
</html>
